# Pipeline DataMart: Hadoop (MapReduce) -> PostgreSQL -> API Flask
# Levantar todo:  docker compose up --build -d

services:
  hadoop:
    build: ./hadoop
    hostname: hadoop
    environment:
      MATRICULA: ${MATRICULA}
    volumes:
      - ./data:/data/input:ro            # dataset de solo lectura (no va en la imagen)
      - ./mapreduce:/opt/mapreduce:ro    # mapper, reducer, secuencial y run_job.sh
      - hadoop_output:/data/output       # salida del job (part-00000)
      - ssh_keys:/keys                   # llave que usa el api para entrar por SSH
    networks:
      - datamart_net

  db:
    image: postgres:16
    env_file: .env                       # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pg_data:/var/lib/postgresql/data # volumen nombrado = persistencia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datamart_net

  api:
    build: ./api
    env_file: .env
    environment:
      DB_HOST: db                        # se conecta a la base por NOMBRE DE SERVICIO
    ports:
      - "${API_PORT}:5000"               # puerto del host : puerto interno de Flask
    volumes:
      - ./scripts:/app/scripts:ro        # cargar_resultados.py
      - hadoop_output:/data/output:ro    # lee el part-00000 que escribio hadoop
      - ssh_keys:/keys:ro                # llave privada para ssh hadoop@hadoop
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_started
    networks:
      - datamart_net

networks:
  datamart_net:
    driver: bridge

volumes:
  pg_data:
  hadoop_output:
  ssh_keys:
